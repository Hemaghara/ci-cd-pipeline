name: Full MERN CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    name: Continuous Integration (Build & Test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Server CI Steps
      - name: Install Server Dependencies
        working-directory: ./server
        run: npm install

      # - name: Run Server Tests (Uncomment when server tests are added)
      #   working-directory: ./server
      #   run: npm test

      # Client CI Steps
      - name: Install Client Dependencies
        working-directory: ./client
        run: npm install

      - name: Run Client Tests
        working-directory: ./client
        run: npm test

      - name: Build Client Project
        working-directory: ./client
        run: npm run build

  cd:
    name: Continuous Deployment
    runs-on: ubuntu-latest
    needs: ci # Only deploy if the CI job passes
    if: github.ref == 'refs/heads/main' # Only deploy on main branch
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Deploy Frontend to Vercel
      - name: Deploy Client to Vercel
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./client
          vercel-args: '--prod'

      # Deploy Backend to Render via Webhook
      - name: Deploy Server to Render
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK }}" ]; then
            echo "RENDER_DEPLOY_HOOK secret is not set, skipping server deployment."
          else
            curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}
            echo "Render deployment triggered!"
          fi